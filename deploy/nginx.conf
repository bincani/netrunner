# Netrunner Collection Tracker — nginx reverse proxy template
#
# 1. Replace `netrunner.example.com` below with your real domain.
# 2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/netrunner.conf
# 3. sudo ln -s /etc/nginx/sites-available/netrunner.conf /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS, run `sudo certbot --nginx -d netrunner.example.com` once this
# HTTP config is working — certbot adds the TLS server block for you.
#
# proxy_pass below assumes the app is listening on 127.0.0.1:3000 (Next.js's
# default port, and what deploy/netrunner.service sets via PORT). If you
# change the app's port, update it here too.

server {
    listen 80;
    listen [::]:80;
    server_name netrunner.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
