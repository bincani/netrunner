# Netrunner Collection Tracker — LOCAL DEV nginx config
#
# Proxies http://netrunner.test to the Next.js dev server (`npm run dev`,
# port 3000), so you can test the app through nginx instead of hitting
# localhost:3000 directly. Plain HTTP, no TLS — for local development only.
# For a real production deployment, see deploy/nginx.conf instead.
#
# Setup (this box uses /etc/nginx/conf.d/*.conf directly, no
# sites-available/sites-enabled):
#
#   1. Point the hostname at this machine — add to /etc/hosts:
#        127.0.0.1  netrunner.test
#
#   2. Install this config:
#        sudo cp deploy/nginx.dev.conf /etc/nginx/conf.d/netrunner-dev.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
#   3. Start the dev server (separately, in the project directory):
#        npm run dev
#
#   4. Visit http://netrunner.test
#
# `next.config.mjs` already allowlists `netrunner.test` via
# `allowedDevOrigins` — required because Next.js blocks dev-server requests
# from any origin other than `localhost` by default, which would otherwise
# break HMR's WebSocket connection when accessed through this proxy.

server {
    listen 80;
    listen [::]:80;
    server_name netrunner.test;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Next.js's HMR WebSocket (/_next/hmr) to work through
        # the proxy — without this, dev-mode hot reload silently fails.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
